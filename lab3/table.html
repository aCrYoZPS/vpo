<!DOCTYPE html>
<head>
<title>Table demo</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
}
table {
width: 100%;
height: 100vh;
border-collapse: collapse;
background: linear-gradient(to right, black, white);

                           table-layout: fixed;
}
th, td {
border:none;
}
</style>
</head>
